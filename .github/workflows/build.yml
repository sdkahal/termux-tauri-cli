name: Build cargo-tauri for Termux

# 编译可在 Termux (Android / arm64) 直接运行的 tauri-cli。
#
# 背景：npm 上的 @tauri-apps/cli 只发布 linux/macos/windows 宿主原生绑定，
# 根本没有 @tauri-apps/cli-android-arm64，所以 Termux 无法使用 npm 版 CLI。
#
# 两处 Termux 适配：
#
# 1) 目标三元组用 aarch64-unknown-linux-musl 而不是 aarch64-linux-android。
#    aarch64-linux-android 编不过，原因有两层：
#      - crates/tauri-cli/src/lib.rs 第一行就是
#          #![cfg(any(target_os = "macos", target_os = "linux", windows))]
#        整个 lib 在 android target 下是空的，android 构建能力直接消失；
#      - tauri-bundler 里的 cfg 只认 linux/windows/macos，没有 android 分支，
#        会报 error[E0425]: cannot find value `bundle_type` / `system_nsis_toolset_path`。
#    改用 musl：静态链接、无 PT_INTERP，Termux 能直接运行。tauri-cli 只是命令行
#    工具，真正编译/链接 Android 的工作由 Termux 原生 cargo + NDK 完成，
#    musl / bionic 的差异在这里无所谓。
#
# 2) 给 cargo-mobile2 打补丁，让它用 `sh gradlew` 调用 Gradle wrapper。
#    cargo-mobile2 是直接 exec `<project>/gradlew` 的，而 Tauri 生成的 wrapper
#    首行是 `#!/usr/bin/env sh`。Termux 上没有 /usr，且 musl 静态二进制无法借助
#    termux-exec 重写 shebang（LD_PRELOAD 对静态可执行文件不生效），于是内核
#    execve 直接返回 ENOENT，表现为：
#      Error `gradlew` not found. Make sure you have the Android SDK installed
#    见 patches/cargo-mobile2-0.22.4-run-gradlew-via-sh.patch。
#    修在 CLI 里而不是改项目里的 gradlew，这样所有 Tauri Android 项目在 Termux
#    上都不必再动仓库文件。
#
# 产物：artifact `cargo-tauri-aarch64-linux-musl-<version>`

on:
  workflow_dispatch:
    inputs:
      version:
        description: "tauri-cli version (must match the npm @tauri-apps/cli version)"
        required: true
        default: "2.11.4"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout this repository (for patches/)
        uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          set -euo pipefail
          V="${{ github.event.inputs.version }}"
          echo "version=${V:-2.11.4}" >> "$GITHUB_OUTPUT"

      - name: Install Rust with the musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Checkout tauri at the matching tag
        run: |
          set -euo pipefail
          git clone --depth 1 \
            --branch "tauri-cli-v${{ steps.v.outputs.version }}" \
            https://github.com/tauri-apps/tauri.git tauri

      - name: Patch cargo-mobile2 to run gradlew via sh
        working-directory: tauri
        env:
          CM2: "0.22.4"
        run: |
          set -euo pipefail

          curl -sSL --retry 3 \
            "https://crates.io/api/v1/crates/cargo-mobile2/${CM2}/download" \
            -o cargo-mobile2.crate
          mkdir -p vendor
          tar xzf cargo-mobile2.crate -C vendor
          rm -f cargo-mobile2.crate
          mv "vendor/cargo-mobile2-${CM2}" vendor/cargo-mobile2
          rm -f vendor/cargo-mobile2/Cargo.lock

          patch -p1 -d vendor/cargo-mobile2 \
            < "$GITHUB_WORKSPACE/patches/cargo-mobile2-${CM2}-run-gradlew-via-sh.patch"

          # 让被 patch 的 crate 自成一个 workspace，否则 cargo 会认为它属于
          # tauri workspace 但不在 members 里而报错
          printf '\n[workspace]\n' >> vendor/cargo-mobile2/Cargo.toml

          # 复用 tauri 根 Cargo.toml 里已存在的 [patch.crates-io] 表
          # （里面已有 schemars_derive / tauri / tauri-plugin / tauri-utils）
          sed -i \
            '/^\[patch\.crates-io\]/a cargo-mobile2 = { path = "./vendor/cargo-mobile2" }' \
            Cargo.toml

          echo "--- Cargo.toml [patch.crates-io] ---"
          sed -n '/^\[patch\.crates-io\]/,/^\[/p' Cargo.toml

          echo "--- patched call site ---"
          grep -n -A14 'if gradlew_p.exists()' vendor/cargo-mobile2/src/util/mod.rs

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri
          key: musl-${{ steps.v.outputs.version }}

      - name: Show disk space
        run: df -h /

      - name: Build tauri-cli (static musl)
        working-directory: tauri
        run: |
          set -euo pipefail

          # 故意不加 --locked：vendored cargo-mobile2 会让 cargo 重写该 crate
          # 在 lockfile 里的来源条目
          cross build --release -p tauri-cli \
            --target aarch64-unknown-linux-musl

          BIN=target/aarch64-unknown-linux-musl/release/cargo-tauri
          ls -la "$BIN"

          # 确认补丁真的生效了：cargo-mobile2 必须变成 path 依赖，
          # 否则说明 cargo 忽略了 [patch]，打出来的 CLI 还是坏的
          python3 <<'PY'
          import sys

          lock = open("Cargo.lock", encoding="utf-8").read()
          for block in lock.split("[[package]]"):
              if 'name = "cargo-mobile2"' in block:
                  if "source = " in block:
                      sys.exit(
                          "ERROR: cargo-mobile2 was NOT patched "
                          "(still a registry source in Cargo.lock)"
                      )
                  print("OK: cargo-mobile2 is a path dependency (patch applied)")
                  break
          else:
              sys.exit("ERROR: cargo-mobile2 missing from Cargo.lock")
          PY

      - name: Strip
        working-directory: tauri
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu
          BIN=target/aarch64-unknown-linux-musl/release/cargo-tauri
          aarch64-linux-gnu-strip --strip-all "$BIN"
          ls -la "$BIN"

      - name: Verify static ARM64 binary
        working-directory: tauri
        shell: bash
        run: |
          set -euo pipefail

          BIN=target/aarch64-unknown-linux-musl/release/cargo-tauri

          file "$BIN"

          readelf -h "$BIN" > /tmp/elfhdr.txt
          readelf -l "$BIN" > /tmp/elfphdr.txt
          grep -E 'Class:|Machine:' /tmp/elfhdr.txt

          grep -q 'Class:.*ELF64'     /tmp/elfhdr.txt || { echo "ERROR: not ELF64";    exit 1; }
          grep -q 'Machine:.*AArch64' /tmp/elfhdr.txt || { echo "ERROR: not AArch64"; exit 1; }

          if grep -q 'INTERP' /tmp/elfphdr.txt; then
            echo "ERROR: PT_INTERP found -> dynamic binary"
            exit 1
          fi
          echo "OK: no PT_INTERP (statically linked)"

          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static

          # qemu-user-static 只提供 qemu-aarch64-static；不带后缀的 qemu-aarch64 属于 qemu-user 包
          QEMU="$(command -v qemu-aarch64-static || command -v qemu-aarch64)"
          echo "using $QEMU"
          "$QEMU" "$BIN" --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cargo-tauri-aarch64-linux-musl-${{ steps.v.outputs.version }}
          path: tauri/target/aarch64-unknown-linux-musl/release/cargo-tauri
          if-no-files-found: error
          retention-days: 30
