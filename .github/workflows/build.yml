name: Build cargo-tauri for Termux

# 编译可在 Termux (Android / arm64) 直接运行的 tauri-cli。
#
# 背景：npm 上的 @tauri-apps/cli 只发布 linux/macos/windows 宿主原生绑定，
# 根本没有 @tauri-apps/cli-android-arm64，所以 Termux 无法使用 npm 版 CLI。
#
# 为什么不直接编 aarch64-linux-android：tauri-bundler 里的 cfg 只认
# linux / windows / macos，没有 android 分支，会直接编译失败：
#   error[E0425]: cannot find value `bundle_type` in this scope
#   error[E0425]: cannot find value `system_nsis_toolset_path` in this scope
#
# 做法：走官方支持的宿主平台分支，编 aarch64-unknown-linux-musl。
# 静态链接、无 PT_INTERP，Termux 可以直接运行（Termux 社区标准做法）。
# tauri-cli 只是个命令行工具，实际编译/链接 Android 的工作由 Termux 原生
# 的 cargo + NDK 完成，所以 musl / bionic 的差异在这里无所谓。
#
# 产物：artifact `cargo-tauri-aarch64-linux-musl-<version>`

on:
  workflow_dispatch:
    inputs:
      version:
        description: "tauri-cli version (must match the npm @tauri-apps/cli version)"
        required: true
        default: "2.11.4"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Resolve version
        id: v
        run: |
          set -euo pipefail
          V="${{ github.event.inputs.version }}"
          echo "version=${V:-2.11.4}" >> "$GITHUB_OUTPUT"

      - name: Install Rust with the musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Checkout tauri at the matching tag
        run: |
          set -euo pipefail
          git clone --depth 1 \
            --branch "tauri-cli-v${{ steps.v.outputs.version }}" \
            https://github.com/tauri-apps/tauri.git tauri

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri
          key: musl-${{ steps.v.outputs.version }}

      - name: Show disk space
        run: df -h /

      - name: Build tauri-cli (static musl)
        working-directory: tauri
        run: |
          set -euo pipefail
          cross build --release --locked -p tauri-cli \
            --target aarch64-unknown-linux-musl
          ls -la target/aarch64-unknown-linux-musl/release/cargo-tauri

      - name: Strip
        working-directory: tauri
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu
          BIN=target/aarch64-unknown-linux-musl/release/cargo-tauri
          aarch64-linux-gnu-strip --strip-all "$BIN"
          ls -la "$BIN"

      - name: Verify static ARM64 binary
        working-directory: tauri
        shell: bash
        run: |
          set -euo pipefail

          BIN=target/aarch64-unknown-linux-musl/release/cargo-tauri

          file "$BIN"

          readelf -h "$BIN" > /tmp/elfhdr.txt
          readelf -l "$BIN" > /tmp/elfphdr.txt
          grep -E 'Class:|Machine:' /tmp/elfhdr.txt

          grep -q 'Class:.*ELF64'     /tmp/elfhdr.txt || { echo "ERROR: not ELF64";    exit 1; }
          grep -q 'Machine:.*AArch64' /tmp/elfhdr.txt || { echo "ERROR: not AArch64"; exit 1; }

          if grep -q 'INTERP' /tmp/elfphdr.txt; then
            echo "ERROR: PT_INTERP found -> dynamic binary"
            exit 1
          fi
          echo "OK: no PT_INTERP (statically linked)"

          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static

          # qemu-user-static 只提供 qemu-aarch64-static；不带后缀的 qemu-aarch64 属于 qemu-user 包
          QEMU="$(command -v qemu-aarch64-static || command -v qemu-aarch64)"
          echo "using $QEMU"
          "$QEMU" "$BIN" --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cargo-tauri-aarch64-linux-musl-${{ steps.v.outputs.version }}
          path: tauri/target/aarch64-unknown-linux-musl/release/cargo-tauri
          if-no-files-found: error
          retention-days: 30
